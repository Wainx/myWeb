 {id:6,title:'把判断讲清楚',tag:'论证与表达',desc:'把结论、证据和行动串成一条线。',lesson:'先说明建议，再给证据与适用范围，接着说明代价和下一步。好的表达让听众知道要做什么，也知道你还不确定什么。',transfer:'把一条真实项目更新改成四句：建议、证据、取舍、负责人和时间。'}
];
window.QUESTIONS = [
 {id:'1-1',chapter:1,type:'single',skill:'事实与假设',title:'一句“系统太慢”，够了吗？',scene:'客户在群里说：“今天系统太慢，肯定是数据库不行，下午前换个数据库吧。”你还没有看到监控或请求样本。',prompt:'哪一句最准确地描述了目前已知的信息？',options:['数据库性能已经被证实是瓶颈。','客户反馈今天系统慢，原因尚未验证。','所有用户今天都受到了影响。','更换数据库能在下午前解决问题。'],answer:1,hint:'区分“有人报告某现象”和“某原因已被证实”。',explain:'目前只有客户反馈这一事实。问题范围、实际延迟、瓶颈和解决方案都需要进一步验证。',why:['把原因猜测当成了结论。','保留了信息来源，也保留了原因的不确定性。','单个反馈不能代表所有用户。','尚无证据支持效果和工期。'],takeaway:'事实要保留来源和范围，避免无意中扩大结论。',sample:'客户反馈今天出现延迟；我会先确认受影响请求与时间窗口，再定位瓶颈。'},
 {id:'1-2',chapter:1,type:'multi',skill:'事实与假设',title:'哪些是观察，哪些是解释？',scene:'你查看了今天 09:00–10:00 的监控。题目只要求区分观察和解释，不判断数据采集是否可靠。',prompt:'选出直接描述已观察数据的两项。',options:['该窗口请求的 p95 延迟为 2.1 秒。','用户变多导致了延迟上升。','抽取的 100 条请求中有 18 条超时。','只要扩容，问题就会消失。'],answer:[0,2],hint:'看到的数值与对数值的因果解释不是同一层。',explain:'p95 和抽样超时数是观察结果；负载导致延迟是因果假设，扩容能解决是方案预测。',why:['给出了窗口内的监控结果。','“导致”需要额外因果证据。','明确了样本与计数。','“只要”把尚未验证的干预当成充分条件。'],takeaway:'用“观察到……”和“我们怀疑……”分别陈述数据与解释。',sample:'09:00–10:00 的 p95 为 2.1 秒；负载增加是候选原因，尚需对照检查。'},
 {id:'1-3',chapter:1,type:'single',skill:'问题定义',title:'“模型好用一点”的验收标准',scene:'团队准备试点内部知识问答。目标是提高有依据的正确回答比例，且不能明显变慢。',prompt:'哪个验收定义最可执行？',options:['让同事觉得更智能。','把模型参数量提升一倍。','在约定的 200 道代表性问题上，人工按同一规则评审，有依据的正确率至少 85%，p95 不超过 3 秒。','上线后有人表扬就算成功。'],answer:2,hint:'目标、测量方法、阈值和约束是否都清楚？',explain:'可验收的目标需要固定评测集、评审规则、质量阈值和延迟约束。这里的 85% 与 3 秒只是题目设定，并非行业标准。',why:['“更智能”缺少定义。','技术投入不是用户结果。','质量和性能都有明确检查方式。','个别好评不能代替事先约定的验收。'],takeaway:'把形容词换成在特定条件下可测量的行为和阈值。',sample:'先约定评测集和评分规则，再以正确率及 p95 双指标验收。'},
 {id:'1-4',chapter:1,type:'single',skill:'证据边界',title:'演示成功，可以全面上线？',scene:'你挑选了 12 个最熟悉的问题做演示，全部回答正确。真实用户的问题尚未采样。',prompt:'目前可以支持的最强结论是什么？',options:['生产正确率为 100%。','产品至少能正确回答本次选定的 12 个问题。','真实用户至少有 95% 会满意。','系统不会在陌生问题上出错。'],answer:1,hint:'结论的范围不能超过样本支持的范围。',explain:'演示证明了这些特定样本上的表现。人为挑选且熟悉的样本不能直接估计真实流量上的正确率。',why:['把选定样本推广到了总体。','结论严格限定在已测试的范围内。','没有用户满意度测量。','未测试的输入不能获得保证。'],takeaway:'不要把展示能力误当成总体性能评估。',sample:'这 12 个演示问题已通过；上线前还需要独立的代表性样本测试。'},
 {id:'1-5',chapter:1,type:'order',skill:'问题定义',title:'把模糊需求整理成行动',scene:'客户希望“报告生成更方便”。目前不知道用户卡在哪里，也没有紧急事故。',prompt:'按先澄清、再设计验证的顺序排列。',options:['提出小范围方案和验证计划。','明确目标用户及当前受阻的任务。','收集现状样本与基线。','约定成功指标和必须满足的约束。'],answer:[1,2,3,0],hint:'先知道谁在做什么，再知道现状和目标，最后决定试什么。',explain:'本题采用的流程是：任务 → 现状 → 成功标准与约束 → 方案。真实项目可以迭代往返，这不是所有项目唯一的顺序。',takeaway:'尽量避免先锁定方案，再寻找它能解决的问题。',sample:'先观察分析师生成报告的具体步骤，记录耗时，再约定目标并试一个最小改进。'},
 {id:'1-6',chapter:1,type:'single',skill:'问题定义',title:'第一条澄清消息',scene:'客户只发来一句：“导出的数据不对。”你需要最快获得可复现的线索。',prompt:'哪条回复最有帮助？',options:['应该是您操作的问题，请再试试。','请提供一个脱敏示例：操作步骤、时间、预期结果和实际结果。','我们会全面重构导出服务。','我们这边一直正常。'],answer:1,hint:'哪条回复能缩小问题范围并让别人复现？',explain:'具体的输入、操作、时间和预期/实际差异能把抽象抱怨变成可检查的问题。',why:['未验证就归因给用户。','请求了定位所需的最小证据。','在定义问题前承诺了大方案。','本地正常不能否定客户情境。'],takeaway:'优先索取一个最小失败样本。',sample:'请发一个脱敏失败样本和操作时间，我会对照预期与实际输出复现。'},
 {id:'2-1',chapter:2,type:'single',skill:'条件推理',title:'通过测试就能上线？',scene:'规则只有一句：“如果允许上线，那么安全测试一定已通过。”已知安全测试通过。',prompt:'仅凭这些信息，能推出什么？',options:['一定允许上线。','一定不允许上线。','是否允许上线仍无法确定。','安全测试并非上线条件。'],answer:2,hint:'安全测试是必要条件，还是足以保证上线的条件？',explain:'允许上线 → 测试通过。测试通过并不能反推允许上线，可能还有审批、容量等条件。',why:['犯了肯定后件的错误。','前提也没有禁止上线。','必要条件满足，不代表其他条件都满足。','规则明确规定了它是必要条件。'],takeaway:'必要条件不自动变成充分条件。',sample:'安全测试已通过，但还需确认其他上线条件。'},
 {id:'2-2',chapter:2,type:'single',skill:'条件推理',title:'一条有效的逆否推理',scene:'已知规则无例外：“如果请求命中缓存，它就不会访问数据库。”某次请求确实访问了数据库。',prompt:'哪项必然成立？',options:['这次请求没有命中缓存。','这次请求的数据库很慢。','所有请求都没命中缓存。','缓存服务已经宕机。'],answer:0,hint:'如果 P → 非 Q，观察到 Q，说明什么？',explain:'命中缓存必定不访问数据库。观察到访问数据库，能排除命中缓存，这是逆否推理。',why:['由规则与观察共同推出。','访问数据库不等于数据库慢。','单次请求不能代表所有请求。','未命中可能是正常情况。'],takeaway:'逆否命题与原命题等价；把范围限定在当前对象。',sample:'按该规则，这次请求没有命中缓存；还不能据此判断缓存服务是否故障。'},
 {id:'2-3',chapter:2,type:'single',skill:'集合推理',title:'“所有”和“有些”的陷阱',scene:'所有生产写入都经过审计。有些经过审计的操作会被阻断。',prompt:'哪项必然成立？',options:['有些生产写入会被阻断。','所有生产写入会被阻断。','所有经过审计的操作都是生产写入。','仅凭前提，不能确定是否有生产写入被阻断。'],answer:3,hint:'被阻断的那些审计操作，可能全是其他类型吗？',explain:'生产写入属于被审计操作的子集，但被阻断的审计操作可能全部位于该子集之外。',why:['两个子集不一定有交集。','更强的全称结论同样没有依据。','把包含关系倒了过来。','存在生产写入被阻断或不被阻断的两种兼容情形。'],takeaway:'画集合关系，并检查“有些”的对象是否真的落在目标集合。',sample:'我们知道生产写入有审计，但还不知道被阻断的操作中是否包含生产写入。'},
 {id:'2-4',chapter:2,type:'single',skill:'反例检验',title:'如何推翻一个全称判断',scene:'有人断言：“所有超过 2 秒的请求，都发生了数据库重试。”',prompt:'哪条观察足以推翻这个断言？',options:['一条 1 秒且发生重试的请求。','一条 3 秒且发生重试的请求。','一条 3 秒且没有重试的请求。','一条 1 秒且没有重试的请求。'],answer:2,hint:'反例必须满足前半句，同时不满足后半句。',explain:'断言是“超过 2 秒 → 有重试”。超过 2 秒却没有重试的请求是直接反例。',why:['前件不成立，不检验该规则。','这是支持规则的实例，不能推翻。','前件真而后件假，构成反例。','前件不成立，不构成反例。'],takeaway:'验证“所有”时，主动寻找一个不符合规则的实例。',sample:'找到一条 3 秒但无重试的请求后，原来的全称解释就需要修改。'},
 {id:'2-5',chapter:2,type:'multi',skill:'条件推理',title:'同时满足才放行',scene:'系统定义：当且仅当“令牌有效”且“用户有权限”时，请求被放行。规则没有例外。',prompt:'选出两个必然成立的判断。',options:['令牌有效就一定放行。','已放行的请求，其令牌一定有效。','未放行的请求，其令牌一定无效。','用户没有权限，请求一定不放行。'],answer:[1,3],hint:'放行等价于两个条件同时为真；失败只说明至少一个不满足。',explain:'放行需要令牌有效且有权限。未放行可能是任一条件失败，不能单独断定令牌无效。',why:['忽略了权限条件。','放行蕴含两个条件都成立。','可能只是没有权限。','缺少任一必要条件就不能放行。'],takeaway:'把“且”和“或”写清楚，尤其是在排查失败条件时。',sample:'未放行只能说明令牌或权限至少一项不满足，应分别检查。'},
 {id:'2-6',chapter:2,type:'single',skill:'约束推理',title:'发布依赖的正确顺序',scene:'三个任务各执行一次。迁移 M 必须在发布 D 之前，验证 V 必须在 D 之后。没有其他约束。',prompt:'哪个顺序符合所有约束？',options:['D → M → V','M → D → V','M → V → D','V → D → M'],answer:1,hint:'把两条关系连接起来：M 在 D 前，D 在 V 前。',explain:'两条约束组合为 M < D < V。其他排列至少违反一个约束。',why:['发布早于迁移。','同时满足两条先后关系。','验证早于发布。','两条关系都不满足。'],takeaway:'先把依赖写成关系，再检查候选顺序。',sample:'先迁移，再发布，最后执行发布验证。'},
 {id:'3-1',chapter:3,type:'single',skill:'因果判断',title:'发布后变慢，就是发布的锅？',scene:'10:00 发布了新版本。10:05 延迟开始上升。同一时段流量也翻倍。',prompt:'哪个判断最严谨？',options:['发布必然导致延迟上升。','流量必然是唯一原因。','发布和流量都是候选原因，需要进一步区分。','两个因素同时变化，因此无法做任何调查。'],answer:2,hint:'时间顺序只能提供线索，不能排除同时变化的其他因素。',explain:'发布与流量同时变化，存在混杂。可以比较相似流量下的新旧版本、请求链路和资源指标来进一步区分。',why:['忽略了流量这个竞争解释。','同样过早锁定唯一原因。','保留竞争假设并寻找区分证据。','仍可设计检查或受控实验。'],takeaway:'相关性用来提出假设，不直接用来宣布根因。',sample:'延迟与发布、流量增加同时出现；下一步比较等负载下新旧版本表现。'},
 {id:'3-2',chapter:3,type:'single',skill:'实验设计',title:'哪个检查最能区分假设？',scene:'调用链显示延迟可能来自网络，也可能来自数据库查询。你可读取各阶段耗时，成本相同，当前无需立即止损。',prompt:'优先做哪个检查？',options:['再收集一次端到端总耗时。','分别检查网络往返耗时与数据库执行耗时。','询问同事最讨厌哪一个组件。','同时升级网络和数据库，然后看结果。'],answer:1,hint:'好检查应让不同假设产生不同的可观察结果。',explain:'分段耗时能定位新增延迟更接近哪一部分。只看总耗时或同时改两个组件，会降低对原因的辨识能力。',why:['重复总量信息，难区分两个假设。','直接测量两个候选原因对应的阶段。','偏好不是故障证据。','多个变量同时变化难以归因。'],takeaway:'优先选择能排除或区分假设的信息。',sample:'先拆开网络与查询耗时，定位增量，再决定干预。'},
 {id:'3-3',chapter:3,type:'multi',skill:'实验设计',title:'一次公平的模型比较',scene:'你要比较模型 A 与 B 在当前业务上的回答质量，且希望差异主要来自模型本身。',prompt:'选出三个应采用的设计。',options:['在同一批代表性问题上测试 A 和 B。','给 A 简单问题，给 B 困难问题。','隐藏模型身份，按同一评分规则评审。','保持检索上下文和其他配置一致。'],answer:[0,2,3],hint:'除了模型之外，哪些差异会影响分数？',explain:'相同问题、相同上下文与配置、盲评和统一规则能减少其他差异的影响。它们并不保证样本足够大或覆盖全面。',why:['控制问题难度和内容差异。','引入了系统性的难度差异。','减少身份偏好并统一评价尺度。','控制检索与配置这些混杂因素。'],takeaway:'比较方案前，先检查比较条件是否公平。',sample:'固定问题和上下文，匿名评审两组答案，最后按问题类型比较结果。'},
 {id:'3-4',chapter:3,type:'single',skill:'证伪与更新',title:'新证据与你的直觉冲突',scene:'你怀疑新缓存代码导致超时，但发现相同超时在发布前一天就存在。假设仅指“新代码是这些超时的最初起因”。',prompt:'应该如何更新判断？',options:['忽略发布前的数据。','继续宣称新代码是最初起因。','排除新代码是最初起因，但仍可检查它是否加剧问题。','证明新代码对系统完全没有任何影响。'],answer:2,hint:'新证据推翻的是哪个精确命题？它没有推翻什么？',explain:'新代码无法造成部署前已经存在的超时，因此不能是这些超时的最初起因。但它是否影响后续严重程度仍是另一个问题。',why:['选择性忽略反证。','与时间证据矛盾。','准确收窄结论并保留独立问题。','排除起因不等于排除一切影响。'],takeaway:'证据针对具体命题，更新时既不回避也不扩大。',sample:'超时早于本次发布，需继续寻找起因，并单独检查新代码是否放大影响。'},
 {id:'3-5',chapter:3,type:'order',skill:'假设检验',title:'让排查过程可复核',scene:'故障已暂时止损，现在开始根因调查。按假设检验流程组织下面四步。',prompt:'排列一个可复核的调查顺序。',options:['根据测试结果排除或修正假设。','写下候选原因及其可观察预测。','确认症状、范围和可靠时间线。','执行能区分候选原因的检查。'],answer:[2,1,3,0],hint:'先确定要解释的现象，再提出预测，最后让证据更新判断。',explain:'确认事实 → 假设与预测 → 区分性检查 → 更新判断。每轮都记录结果，包括不支持原假设的结果。',takeaway:'记录“排除了什么”与记录“发现了什么”同样有用。',sample:'确认范围后，为两个候选原因各写一个预测，再选择最能区分它们的检查。'},
 {id:'3-6',chapter:3,type:'single',skill:'证据强弱',title:'缓存一定带来提升吗？',scene:'周一关闭缓存时平均延迟 300ms，周二开启缓存时 180ms。两天请求类型和流量结构不同。',prompt:'目前最应该保留的疑问是什么？',options:['毫秒不是有效的时间单位。','两天请求结构不同，可能解释部分或全部变化。','开启缓存必然使所有请求都减少 120ms。','均值变好证明没有长尾问题。'],answer:1,hint:'比较前后变化时，除了干预，还有什么同时变化？',explain:'请求构成差异可能使均值变化。需要在可比条件下比较，或分请求类型检查效果。',why:['毫秒可以用于延迟度量。','识别出了关键混杂因素。','总体均值不能推导单个请求的改善。','均值不能代表尾部延迟。'],takeaway:'前后对比需要检查样本构成，而不只是比较两个数字。',sample:'平均延迟下降，但请求结构也改变了；先做分组对比，再评估缓存的贡献。'},
 {id:'4-1',chapter:4,type:'number',skill:'基准率',title:'告警响了，真的故障吗？',scene:'假设 1,000 次检查中恰有 10 次真实故障。告警检出全部 10 次故障，又将 990 次正常检查中的 99 次误报为故障。',prompt:'所有告警中，真实故障约占百分之多少？输入百分数，保留 1 位小数。',answer:9.2,tolerance:0.05,unit:'%',hint:'分母是“真实告警 + 误报告警”，不是总检查数。',explain:'一共 10 + 99 = 109 次告警，其中 10 次是真实故障。10 ÷ 109 × 100% ≈ 9.2%。',takeaway:'告警检出率很高，并不代表告警之后故障概率也很高。',sample:'本题的告警准确率约 9.2%；低基准率下，即使检出率高，也要关注误报。'},
 {id:'4-2',chapter:4,type:'number',skill:'指标口径',title:'提升了多少？',scene:'在同一套评测口径下，正确率从 80% 提升到 88%。',prompt:'正确率提升了多少“个百分点”？',answer:8,tolerance:0,unit:'个百分点',hint:'百分点算相减；相对增长率还要除以原值。',explain:'88% − 80% = 8 个百分点。相对增长率是 8 ÷ 80 = 10%，二者不能混写。',takeaway:'报告变化时说明是绝对差值还是相对变化。',sample:'正确率提高 8 个百分点，相对提升 10%。'},
 {id:'4-3',chapter:4,type:'single',skill:'分布判断',title:'平均延迟掩盖了什么？',scene:'某次测试包含 100 个请求：99 个耗时 100ms，1 个耗时 10,000ms。',prompt:'哪项描述正确？',options:['所有用户都大约等待 199ms。','平均延迟为 199ms，但存在一个严重的长尾请求。','平均延迟为 100ms，因此没有长尾。','只要均值小于 200ms，就能证明任何延迟目标都满足。'],answer:1,hint:'均值 = 总耗时 / 请求数；它不代表每个观测值。',explain:'(99 × 100 + 10,000) ÷ 100 = 199ms。均值较小依然可能隐藏极慢的个别请求。',why:['均值不是每位用户的体验。','计算正确，并保留了分布信息。','漏算了那个慢请求。','必须看目标具体约束均值还是分位数等指标。'],takeaway:'根据用户体验目标选指标，必要时同时查看分布和异常样本。',sample:'平均值是 199ms，但有一个 10 秒请求，需要单独定位尾部问题。'},
 {id:'4-4',chapter:4,type:'single',skill:'样本与不确定性',title:'两次全对意味着更强吗？',scene:'A 在 2 个问题上答对 2 个；B 在另一批 100 个问题上答对 92 个。两批问题的难度未知。',prompt:'能据此得出什么结论？',options:['A 一定优于 B，因为 100% > 92%。','B 一定优于 A，因为样本更多。','当前证据不足以可靠排序，应在同一代表性评测集上比较。','两个模型性能完全相同。'],answer:2,hint:'除了比例，还要看样本量和比较条件。',explain:'样本量悬殊且问题不同，无法把百分比差异直接解释为模型能力差异。相同代表性题集能改善可比性，但仍需足够样本。',why:['忽略样本量与难度差异。','更多样本不自动意味着性能更好。','指出了不确定性，并给出可操作的补证方法。','证据不足不等于已经证明相同。'],takeaway:'“还不能判断”也是有价值的结论，尤其要说明需要什么证据。',sample:'两批样本不可直接比较；先用同一评测集测试，再报告差值和不确定性。'},
 {id:'4-5',chapter:4,type:'number',skill:'加权汇总',title:'不能直接平均两个成功率',scene:'小客户有 10 次请求，成功 10 次；大客户有 90 次请求，成功 72 次。按请求数统计整体成功率。',prompt:'整体成功率是多少？输入百分数。',answer:82,tolerance:0,unit:'%',hint:'先加成功次数，再加总请求数。',explain:'整体成功率 = (10 + 72) ÷ (10 + 90) = 82%。直接平均 100% 与 80% 得到 90%，那是按客户等权，而不是按请求统计。',takeaway:'聚合指标前明确权重与分母。',sample:'按请求加权的整体成功率为 82%；客户等权均值是另一个指标。'},
 {id:'4-6',chapter:4,type:'single',skill:'基准与代表性',title:'满意度里的沉默用户',scene:'产品团队只向活跃用户发问卷，回复者中 90% 表示满意。流失用户没有收到问卷。',prompt:'主要的推断风险是什么？',options:['任何问卷都没有价值。','回复者必定说谎。','样本可能遗漏不满意而流失的人，不能直接代表所有用户。','90% 可以证明所有流失都与产品无关。'],answer:2,hint:'哪些人根本没有机会进入样本？',explain:'抽样框仅包含活跃用户，同时还有是否回复的选择过程。结果可以描述回复者，但不能自动推广到所有用户。',why:['问卷有价值，关键是明确范围和偏差。','没有证据支持这个判断。','指出了样本选择与结论范围的差距。','未观察流失用户的原因。'],takeaway:'检查“谁没有被统计进来”，和检查已有样本一样重要。',sample:'90% 的回复者满意；还需要接触流失用户，了解样本之外的体验。'},
 {id:'5-1',chapter:5,type:'single',skill:'硬约束',title:'先过滤，再排名',scene:'项目硬约束：数据必须留在客户内网，且 2 周内交付。A：外部云服务，1 周；B：内网部署，2 周；C：内网重构，6 周。只考虑题中条件。',prompt:'哪一个方案可行？',options:['A，因为最快。','B，因为同时满足两个硬约束。','C，因为听起来最彻底。','三个方案都可行，只需比较功能。'],answer:1,hint:'硬约束不是可用更高功能分补偿的偏好。',explain:'A 违反数据边界，C 违反交付期限，只有 B 满足全部硬约束。实际项目还需核实估算与其他要求。',why:['速度不能抵消内网约束。','按给定条件，它是唯一可行方案。','彻底不能抵消期限约束。','有方案已经违反约束。'],takeaway:'先筛掉不可行方案，再比较偏好与收益。',sample:'在内网和两周两条约束下选 B；随后验证工期与交付风险。'},
 {id:'5-2',chapter:5,type:'number',skill:'期望值',title:'小实验值不值得做？',scene:'按题目给定估计：一个实验固定花费 2 小时；有 50% 概率找到优化，节省后续 10 小时；否则节省 0 小时。不考虑其他收益或风险。',prompt:'实验的期望净节省时间是多少小时？',answer:3,tolerance:0,unit:'小时',hint:'期望收益 = 概率 × 收益，再扣除确定成本。',explain:'0.5 × 10 + 0.5 × 0 − 2 = 3 小时。这是基于给定概率的期望，并不是每次都节省 3 小时。',takeaway:'区分期望值和单次结果，并检查概率估计的依据。',sample:'按当前估计，期望净节省 3 小时；一次实验仍可能只花掉 2 小时而无收益。'},
 {id:'5-3',chapter:5,type:'single',skill:'可逆决策',title:'不确定时如何推进',scene:'新流程可能提高效率，也可能增加错误。系统支持按小组开关、观测指标和即时回滚，目前没有必须全量发布的期限。',prompt:'哪种推进方式最利于控制风险并获得信息？',options:['全量开启，且不设回滚。','永远不改，等所有不确定性消失。','小组试点，事先约定指标、观察窗口和回滚条件。','只询问最支持这个方案的人。'],answer:2,hint:'寻找能以较低代价验证关键假设的可逆步骤。',explain:'有限范围的试点配合预设指标和回滚条件，可以获得证据并约束影响。试点组仍需考虑代表性。',why:['放大影响且无法及时撤回。','不确定性通常不会自行全部消失。','兼顾验证价值和影响边界。','会加重确认偏差。'],takeaway:'用可逆的小步骤换取信息。',sample:'先在一个有代表性的小组试点，达到预设错误率阈值就回滚。'},
 {id:'5-4',chapter:5,type:'multi',skill:'决策质量',title:'上线前要写清楚什么？',scene:'团队准备对 10% 流量启用新检索流程。你需要一个能支持继续、停止或回滚的试点计划。',prompt:'选出三个直接服务于决策的内容。',options:['主要指标、基线及评估窗口。','触发回滚的条件与负责人。','证明设计者比其他团队更聪明。','继续扩大流量所需的证据。'],answer:[0,1,3],hint:'试点之后，团队依据什么做下一步决定？',explain:'指标与窗口定义观察方式，回滚条件控制风险，扩量证据约束后续决策。评价个人优越性不帮助试点判断。',why:['让结果有可比较的标准。','让异常发生时有可执行动作。','偏离业务与技术决策目标。','避免见到一点好结果就随意扩量。'],takeaway:'试点开始前，就写下怎样根据结果行动。',sample:'试点观察一天，对照基线评估；错误率越线由当班负责人回滚。'},
 {id:'5-5',chapter:5,type:'single',skill:'边际决策',title:'已经投入这么多了',scene:'A 已耗费 3 周。从现在起，A 还需 4 周，B 需 1 周；两者未来效果相同，切换 B 没有额外成本或风险。唯一目标是尽早交付。',prompt:'应选择什么？',options:['继续 A，因为已经花了 3 周。','改用 B，因为从现在起只需 1 周。','继续 A，直到投入达到整数周。','无法比较，因为过去的投入不一样。'],answer:1,hint:'过去已不可收回的投入，会改变未来交付时间吗？',explain:'在题设条件下，过去 3 周是沉没成本。从现在开始比较，B 更早交付。现实中若有切换成本，应将它计入未来成本。',why:['用不可收回成本主导了未来决策。','按目标比较了未来成本。','整数周与目标无关。','仍可比较未来时间。'],takeaway:'只把能被当前决策改变的成本和收益纳入比较。',sample:'在效果相同且无切换代价的前提下，改用 B 能更早交付。'},
 {id:'5-6',chapter:5,type:'single',skill:'权衡边界',title:'最快的方案就是最好的吗？',scene:'A：延迟 100ms、月成本 8 万；B：延迟 180ms、月成本 3 万。硬性延迟要求为不超过 200ms，月预算不超过 4 万；满足要求后优先省钱。',prompt:'根据给定目标应选哪一个？',options:['A，因为延迟更低。','B，因为满足要求且成本在预算内。','A，因为贵的必然更稳定。','无法决策，必须先把两者延迟都降到 50ms。'],answer:1,hint:'先检查硬约束，再按剩余目标比较。',explain:'两者都满足延迟要求，但 A 超过预算。B 在约束内且更省钱；无证据支持贵意味着更稳定。',why:['单项指标最优不等于整体可行。','满足两条约束并符合成本偏好。','价格不是稳定性的证据。','添加了题目没有要求的新目标。'],takeaway:'避免把一个好看的技术指标替代真正的项目目标。',sample:'选择 B：延迟满足 200ms 要求，成本 3 万也符合预算。'},
 {id:'6-1',chapter:6,type:'single',skill:'结构化表达',title:'先让负责人知道什么',scene:'客户负责人只给你 30 秒。灰度发现错误率升高，已达到事先约定的回滚阈值。',prompt:'最合适的第一句话是什么？',options:['我们先从缓存架构的历史说起。','建议现在回滚灰度版本，错误率已超过约定阈值。','最近大家都很努力，问题很复杂。','日志里面有很多值得研究的字段。'],answer:1,hint:'先回应对方此刻最需要做出的决定。',explain:'负责人需要立即理解建议和依据。技术细节可以随后补充，但不应遮住当前行动。',why:['背景过长，延迟了关键决策信息。','同时交代建议与关键证据。','没有说明影响和行动。','信息与当前决定的关联不清楚。'],takeaway:'在决策场景，优先给出建议及其最关键的依据。',sample:'建议立即回滚，错误率已越过阈值；我来执行，十分钟后确认恢复情况。'},
 {id:'6-2',chapter:6,type:'order',skill:'结构化表达',title:'让一段汇报形成论证',scene:'你要按“结论—依据—取舍—行动”向客户报告方案。',prompt:'将四句话排成这个结构。',options:['代价是增加半天验证，收益是避免直接全量变更。','建议先修复检索，再评估是否换模型。','我今天完成修复，明天下午用同一评测集复测。','抽查 20 个失败案例，其中 14 个未检索到相关资料。'],answer:[1,3,0,2],hint:'先说建议，用数据支撑，再说明代价和谁来做什么。',explain:'建议给方向，样本给依据，取舍说明代价，最后用负责人、时间和方法把讨论变成行动。样本仍不保证总体根因比例相同。',takeaway:'每一段信息都应服务于结论或下一步。',sample:'建议先修检索；20 个失败样本中 14 个未找到资料。多用半天验证，明天下午同集复测。'},
 {id:'6-3',chapter:6,type:'single',skill:'表达不确定性',title:'不确定，也可以讲得很清楚',scene:'只有 30 分钟测试数据，错误率从 4% 降至 2%，样本量较小，尚未覆盖峰值流量。',prompt:'哪种汇报最准确？',options:['问题已经永久解决。','目前样本错误率从 4% 降到 2%；样本较小且未覆盖峰值，需要继续观察后再决定扩量。','感觉好了很多，应该没事。','数据不完美，所以完全不能说任何事情。'],answer:1,hint:'同时说清已观察的变化、限制和后续动作。',explain:'清晰表达不确定性并非不作判断，而是界定证据覆盖范围，并说明如何补足证据。',why:['超出了短期样本能支持的范围。','数字、限制和下一步都明确。','模糊感觉掩盖了限制。','可以报告观察，只需保留边界。'],takeaway:'用“目前观察到……，尚未验证……，下一步……”组织不确定性。',sample:'当前样本错误率下降 2 个百分点；需覆盖峰值后再评估扩量。'},
 {id:'6-4',chapter:6,type:'single',skill:'识别论证缺口',title:'一句“行业领先”的缺口',scene:'提案写道：“供应商声称方案行业领先，因此它一定最适合我们。”尚未提供业务评测、约束或成本比较。',prompt:'这个论证最核心的问题是什么？',options:['供应商说的话必然全是假话。','没有建立“行业领先”与“满足我们的目标和约束”之间的证据联系。','任何外部方案都不能采用。','只要换成更长的句子就足够严谨。'],answer:1,hint:'即使前半句是真的，后半句是否仍可能不成立？',explain:'一般性地位不等于具体场景适配。需要用业务样本、约束和成本来支持适配判断，而不是简单否定供应商。',why:['对信息来源作了没有证据的全盘否定。','指出了从一般评价跳到具体适用性的缺口。','添加了不受支持的禁用结论。','句子长度不能补上证据。'],takeaway:'检查每个“因此”前后的连接是否成立。',sample:'我们需要用自己的业务样本与约束评估适配性，排名只能作为背景信息。'},
 {id:'6-5',chapter:6,type:'multi',skill:'可执行沟通',title:'让下一步真的发生',scene:'复盘结尾需要明确行动项，团队已确认需要补充超时监控。',prompt:'选出三个让行动项可执行的必要信息类别。',options:['明确的负责人。','可检查的完成物或验收标准。','完成时间或检查节点。','尽量多地使用技术缩写。'],answer:[0,1,2],hint:'谁，做成什么，什么时候检查？',explain:'责任、可检查结果和时间节点使行动可追踪。技术缩写只有在帮助理解时才有价值。',why:['明确谁推动落实。','明确怎样算完成。','明确什么时候回看结果。','术语数量不提升可执行性。'],takeaway:'把“后续优化”改成有负责人、结果和时间的行动。',sample:'由当班工程师周五前补充超时告警，用一次模拟超时验证告警送达。'},

  const q=qById(s.ids[s.index]),d=s.draft;
  if(![50,75,95].includes(d.confidence)||!bool(d.hint)||typeof d.rationale!=='string'||d.rationale.length>1000||!Array.isArray(d.order)||d.order.length!==(q.options?.length??0)||new Set(d.order).size!==d.order.length||!d.order.every(v=>int(v,0,d.order.length-1)))fail();
  if(q.type==='single'&&d.selection!==null&&!validValue(q,d.selection))fail();if(q.type==='multi'&&(!Array.isArray(d.selection)||(d.selection.length&&!validValue(q,d.selection))))fail();if(q.type==='number'&&(typeof d.selection!=='string'||d.selection.length>50||(d.selection!==''&&!Number.isFinite(Number(d.selection)))))fail();
  out.active=JSON.parse(JSON.stringify(s));
 }
 return out;
}
$('#import-file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>1_000_000)throw new Error('文件过大；请选择小于 1 MB 的进度存档。');const incoming=validateState(JSON.parse(await file.text()));showDialog('恢复这份存档？',`该文件包含 ${Object.keys(incoming.answers).length} 道题的学习记录。当前进度会先导出备份，再被替换。`,'备份并恢复',()=>{exportState();state=incoming;save();home();toast('进度已恢复。');});}catch(error){const message=error instanceof SyntaxError?'文件不是有效的 JSON，请选择导出的进度文件。':error.message;if($('#import-status'))$('#import-status').textContent=message;else toast(message);}};
try{const raw=localStorage.getItem(KEY);if(raw)state=validateState(JSON.parse(raw));localStorage.setItem(KEY,JSON.stringify(state));}catch{storageOK=false;loadWarning='已有存档无法读取，或浏览器限制了本地存储。可在设置中导出本次进度。';}
const context=document.modelContext;
if(context?.registerTool){const lifecycle=new AbortController();const register=tool=>{try{Promise.resolve(context.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}};
 register({name:'read_training_progress',description:'Read local chapter progress and review counts without changing training state.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true},execute:()=>({completed:completed(),total:6,practiced:Object.keys(state.answers).length,wrong:wrongIds().length,due:dueIds().length})});
 register({name:'start_logic_chapter',description:'Start an unlocked chapter. Fails when another session is active; never discards it.',inputSchema:{type:'object',properties:{chapter:{type:'integer',minimum:1,maximum:6}},required:['chapter'],additionalProperties:false},annotations:{readOnlyHint:false},execute:input=>{if(!input||!Number.isInteger(input.chapter)||input.chapter<1||input.chapter>6)throw new Error('Invalid chapter');if(!unlocked(input.chapter))throw new Error('Chapter locked');if(state.active)throw new Error('Session already active');createSession('chapter',input.chapter);return {chapter:input.chapter,question:1,total:6};}});
 window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}
let toastTimer;function toast(msg){$('#toast').textContent=msg;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),3200);}
home();if(loadWarning)toast(loadWarning);
})();
